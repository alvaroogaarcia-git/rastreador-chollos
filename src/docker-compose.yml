version: '3.8'

services:
  backend-node:
    build:
      context: .
      dockerfile: backend-node/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PYTHON_SERVICE_URL=http://backend-python:5000
    depends_on:
      - backend-python

  backend-python:
    build:
      context: .
      dockerfile: backend-python/Dockerfile
    ports:
      - "5000:5000"