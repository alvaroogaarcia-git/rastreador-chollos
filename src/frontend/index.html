<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rastreador de Chollos | Monitor de Precios</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>🏷️ Monitor de Precios en Tiempo Real</h1>
            <p>Introduce la URL de cualquier producto para rastrear su precio.</p>
        </header>

        <main>
            <!-- Formulario para agregar productos -->
            <section class="card">
                <h2>Rastrear Nuevo Producto</h2>
                <form id="productForm">
                    <div class="input-group">
                        <input 
                            type="url" 
                            id="productUrl" 
                            placeholder="https://ejemplo.com/producto..." 
                            required
                        >
                        <button type="submit" id="submitBtn">Añadir Producto</button>
                    </div>
                </form>
                <div id="statusMessage" class="message hidden"></div>
            </section>

            <!-- Lista de productos monitorizados -->
            <section class="card">
                <h2>Productos Monitorizados</h2>
                <div id="productsList" class="products-grid">
                    <p class="empty-state">Cargando productos...</p>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
